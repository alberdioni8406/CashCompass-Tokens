<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CashCompass Tokens — A Bitcoin Cash Token Atlas</title>
<meta name="description" content="Explore CashTokens on Bitcoin Cash: community tokens, NFTs, loyalty programs, event passes and membership credentials, mapped and explained." />

<!-- Fonts: Space Grotesk (display), JetBrains Mono (data/mono), Inter (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Ambient scanline / grain overlay, purely decorative -->
<div class="grain-overlay" aria-hidden="true"></div>

<!-- ============ NAV ============ -->
<header class="site-header">
  <div class="wrap header-inner">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <path d="M16 2 L28 9 V23 L16 30 L4 23 V9 Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="16" cy="16" r="4.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">CashCompass <em>Tokens</em></span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="#explorer">Explorer</a>
      <a href="#live-lookup">Live Lookup</a>
      <a href="#trending">Trending</a>
      <a href="#use-cases">Use Cases</a>
      <a href="#education">What's a CashToken?</a>
    </nav>
    <div class="header-actions">
      <button class="wallet-btn" id="walletBtn" type="button">
        <span class="wallet-btn-dot" aria-hidden="true"></span>
        <span id="walletBtnLabel">Connect wallet</span>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN VIEW MOUNT ============ -->
<!-- The app renders either the dashboard view or a token detail view into #view,
     depending on the URL hash (#/ for dashboard, #/token/<id> for detail).
     See app.js -> router() -->
<main id="view"></main>

<!-- ============ TEMPLATE: DASHBOARD VIEW ============ -->
<template id="tpl-dashboard">
<div>

  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <p class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span> Live on Bitcoin Cash — CashTokens layer</p>
        <h1 class="hero-title">
          Explore the Future of <span class="ink">Bitcoin Cash Tokens</span>
        </h1>
        <p class="hero-subtitle">
          Discover CashTokens, digital assets, NFTs, and programmable ownership
          built on Bitcoin Cash — mapped, explained, and searchable, without needing
          blockchain expertise.
        </p>
        <div class="hero-actions">
          <a href="#explorer" class="btn btn-primary">Open the Explorer</a>
          <a href="#education" class="btn btn-ghost">What is a CashToken?</a>
        </div>
      </div>

      <div class="hero-console" role="img" aria-label="Live token ledger readout">
        <div class="console-head">
          <span class="console-dot"></span>
          <span class="console-dot"></span>
          <span class="console-dot"></span>
          <span class="console-title">ledger&nbsp;/&nbsp;live_feed.log</span>
        </div>
        <div class="console-body" id="consoleFeed">
          <!-- populated by app.js: typewriter feed of recent token activity -->
        </div>
      </div>
    </div>
  </section>

  <!-- STAT CARDS -->
  <section class="stats">
    <div class="wrap stats-grid" id="statsGrid">
      <!-- populated by app.js -->
    </div>
  </section>

  <!-- EXPLORER -->
  <section class="explorer" id="explorer">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Catalog 002</p>
        <h2>Token Explorer</h2>
        <p class="section-lede">Search the atlas by name, category ID, or creator address. Every entry is a real CashTokens structure — fungible tokens and NFTs live side by side, the way they do on-chain.</p>
      </div>

      <div class="explorer-controls">
        <div class="search-field">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/></svg>
          <input type="text" id="searchInput" placeholder="Search by name, category ID, or creator address…" autocomplete="off" />
        </div>
        <div class="filter-row" id="filterRow" role="group" aria-label="Filter by category">
          <!-- populated by app.js -->
        </div>
      </div>

      <p class="result-count" id="resultCount"></p>
      <div class="token-grid" id="tokenGrid">
        <!-- populated by app.js -->
      </div>
      <p class="empty-state" id="emptyState" hidden>No tokens match that search. Try a different name, category ID, or creator address.</p>
    </div>
  </section>

  <!-- LIVE ON-CHAIN LOOKUP (real network calls, see api/token.js + api/address.js) -->
  <section class="live-lookup" id="live-lookup">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Catalog 002.5 — Live</p>
        <h2>Look up anything, for real</h2>
        <p class="section-lede">The atlas above is curated example data. This box hits Bitcoin Cash mainnet directly — paste a real 64-character token category ID or a real BCH address.</p>
      </div>

      <div class="lookup-controls">
        <div class="lookup-type-toggle" role="group" aria-label="Lookup type">
          <button class="filter-chip active" data-lookup-type="category" type="button">Category ID</button>
          <button class="filter-chip" data-lookup-type="address" type="button">Address</button>
        </div>
        <div class="search-field">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm9 2-5.2-5.2"/></svg>
          <input type="text" id="lookupInput" placeholder="64-char category ID (e.g. a genesis txid)" autocomplete="off" spellcheck="false" />
          <button class="btn btn-primary" id="lookupBtn" type="button" style="padding:9px 20px;">Look up</button>
        </div>
      </div>

      <div id="lookupResult" class="lookup-result" aria-live="polite"></div>
    </div>
  </section>

  <!-- TRENDING -->
  <section class="trending" id="trending">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Catalog 003</p>
        <h2>🔥 Trending CashTokens</h2>
        <p class="section-lede">Ranked by real ecosystem signal — holder growth and on-chain activity, not price speculation.</p>
      </div>
      <div class="trending-list" id="trendingList">
        <!-- populated by app.js -->
      </div>
    </div>
  </section>

  <!-- USE CASES -->
  <section class="use-cases" id="use-cases">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow">Catalog 004</p>
        <h2>Built for real use, not speculation</h2>
        <p class="section-lede">CashTokens exist because Bitcoin Cash can carry more than a balance. Here's what people are actually building.</p>
      </div>
      <div class="usecase-grid">
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">🎟️</span>
          <h3>Event tickets</h3>
          <p>An NFT CashToken that acts as proof of admission — transferable, unforgeable, and verifiable at the door without a central database.</p>
        </article>
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">🪪</span>
          <h3>Membership passes</h3>
          <p>Hold the token, keep the access. Communities and clubs issue fungible or NFT passes that unlock gated content or spaces.</p>
        </article>
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">☕</span>
          <h3>Merchant loyalty</h3>
          <p>Shops mint their own points token. Customers earn it on purchase and redeem it later — no app, no middleman, just BCH.</p>
        </article>
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">🖼️</span>
          <h3>Digital collectibles</h3>
          <p>Artists mint provably scarce NFTs directly on Bitcoin Cash, with near-zero fees and no separate token-chain required.</p>
        </article>
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">🤝</span>
          <h3>Community rewards</h3>
          <p>Contributors are paid in a community-defined token that represents standing, voice, or shared ownership of a project.</p>
        </article>
        <article class="usecase-card">
          <span class="usecase-icon" aria-hidden="true">🧾</span>
          <h3>Programmable ownership</h3>
          <p>CashTokens can be paired with smart contracts (covenants) so ownership itself carries rules — royalties, vesting, or redemption logic.</p>
        </article>
      </div>
    </div>
  </section>

  <!-- EDUCATION -->
  <section class="education" id="education">
    <div class="wrap education-inner">
      <div class="section-head" style="text-align:left; margin-bottom:0;">
        <p class="eyebrow">Field Notes</p>
        <h2>What's a CashToken, really?</h2>
      </div>
      <div class="education-grid">
        <div class="edu-item">
          <h3>01 — Native, not bridged</h3>
          <p>CashTokens live directly on the Bitcoin Cash ledger. There's no wrapped version, no separate side-chain, and no bridge to trust — the token and the money that moves it settle in the same transaction.</p>
        </div>
        <div class="edu-item">
          <h3>02 — Category ID</h3>
          <p>Every token type is identified by a unique 32-byte category ID, set permanently at creation. It's the token's fingerprint — used to look it up, verify it, and tell it apart from every other token that has ever existed.</p>
        </div>
        <div class="edu-item">
          <h3>03 — Fungible or NFT</h3>
          <p>A single category can mint fungible amounts (like points or shares) and/or non-fungible tokens (like tickets or collectibles) — the same category ID, two different shapes of ownership.</p>
        </div>
        <div class="edu-item">
          <h3>04 — Fees stay low</h3>
          <p>Because CashTokens are part of Bitcoin Cash's base layer, moving a token costs about the same as moving BCH itself — a fraction of a cent, even at scale.</p>
        </div>
      </div>
    </div>
  </section>

</div>
</template>

<!-- ============ TEMPLATE: TOKEN DETAIL VIEW ============ -->
<template id="tpl-detail">
<div class="detail-view">
  <div class="wrap">
    <a href="#explorer" class="back-link">← Back to explorer</a>

    <div class="detail-header">
      <div class="detail-media" id="detailMedia"></div>
      <div class="detail-heading">
        <p class="detail-category-chip" id="detailCategoryChip"></p>
        <h1 id="detailName"></h1>
        <p class="detail-symbol" id="detailSymbol"></p>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-badges" id="detailBadges"></div>
      </div>
    </div>

    <div class="detail-body">
      <div class="detail-main">

        <div class="panel">
          <h2 class="panel-title">Why does this token exist?</h2>
          <p class="utility-text" id="detailUtility"></p>
        </div>

        <div class="panel">
          <h2 class="panel-title">Recent transactions</h2>
          <div class="tx-list" id="detailTxList"></div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Holder distribution</h2>
          <div class="holder-bars" id="detailHolderBars"></div>
          <p class="holder-note">Illustrative distribution across top holders — connect a real indexer to replace this with live data. See app.js.</p>
        </div>

      </div>

      <aside class="detail-side">
        <div class="panel spec-panel">
          <h2 class="panel-title">Specification</h2>
          <dl class="spec-list" id="specList"></dl>
        </div>
      </aside>
    </div>

  </div>
</div>
</template>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>CashCompass Tokens — part of <strong>BCH Lab</strong>. Educational atlas for the CashTokens ecosystem. Mock data for prototype purposes.</p>
    <p class="footer-links"><a href="https://bch.info" target="_blank" rel="noopener">bch.info</a> · <a href="#/" >Back to top</a></p>
  </div>
</footer>

<!-- wallet.js is a module so it can import @walletconnect/sign-client from a CDN;
     it exposes window.CCWallet for app.js (a classic script) to use. -->
<script type="module" src="wallet.js"></script>
<script src="app.js"></script>
</body>
</html>
